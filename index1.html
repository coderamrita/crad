<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bad+Script&family=Betania+Patmos&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Caveat:wght@400..700&family=Cinzel:wght@400..900&family=Cookie&family=Delius&family=Elsie:wght@400;900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playwrite+BR+Guides&family=Playwrite+NZ+Basic:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&family=Tagesschrift&display=swap');
         body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
         .container{
            height: 80vh;
            width: 50vh;
            background: linear-gradient(palegreen,white,aqua);
            border-radius: 50px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 25px 50px -12px;
                  overflow: scroll;

        }
         h1{
            text-align: center;
            padding-top: 20px;
            transition: 1s;
              font-family: "Cinzel", serif;
                  }
                     img{
                    display: block;
                    margin: 0 auto;
                     }
                     h2{
                        text-align: center;
                        font-family: "Lobster Two", sans-serif;
                     }
                     button{
                        display: block;
                        margin: 0 auto;
                        height: 50px;
                        width: 100px;
                        border-radius: 20px;
                        border: none;
                        background-color: pink;
                        cursor: pointer;
                        transition: 1s;
                        font-size: 20px;
                        text-decoration: none;
                     }
                     button:hover{
                        background-color: crimson;
                        color: white;
                     }
                     p{
                        text-align: center;
                        font-family: "Kaushan Script", cursive;
                     }
               
                  
    </style>
</head>
<body>
    <div class="container">
    <h1>BCA -3rd Sem</h1>
    <img src="COMPUTER.svg" alt="Icon"height="150px"width="150px">
     <h2>Subjects</h2>

        <p>1. PYTHON</p>
        <p>2. WEB DEVELOPMENT</p>
        <p>3. MATH</p>
        <p>4. AI THEORY & PRACTICAL</p>
        <p>5. ENGLISH COMMUNICATION</p>
        <button>Submit</button>
         </div>
</body>
</html>
